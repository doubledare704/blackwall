<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Microchip Body -->
  <rect x="24" y="16" width="80" height="96" rx="6" fill="#051a14" stroke="#00ff99" stroke-width="2" filter="url(#glow-green)" />

  <!-- Gold/Cyber Contact Pins (Left & Right) -->
  <path d="M12 28 H24 M12 44 H24 M12 60 H24 M12 76 H24 M12 92 H24" stroke="#00ff99" stroke-width="3" />
  <path d="M104 28 H116 M104 44 H116 M104 60 H116 M104 76 H116 M104 92 H116" stroke="#00ff99" stroke-width="3" />

  <!-- Memory Die Blocks -->
  <rect x="36" y="28" width="24" height="18" fill="#003322" stroke="#00ff99" stroke-width="1" />
  <rect x="68" y="28" width="24" height="18" fill="#003322" stroke="#00ff99" stroke-width="1" />
  <rect x="36" y="54" width="24" height="18" fill="#003322" stroke="#00ff99" stroke-width="1" />
  <rect x="68" y="54" width="24" height="18" fill="#003322" stroke="#00ff99" stroke-width="1" />

  <!-- Glowing Bus Data Lines -->
  <path d="M64 16 V112 M36 82 H92 M36 94 H92" stroke="#00ff99" stroke-width="1.5" stroke-dasharray="4 2" />
  <circle cx="64" cy="82" r="4" fill="#ffffff" filter="url(#glow-green)" />
</svg>
