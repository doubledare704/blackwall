<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#006699" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Outer Tech Ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#004466" stroke-width="2" stroke-dasharray="8 4 2 4" />
  <circle cx="64" cy="64" r="50" fill="#060d1a" fill-opacity="0.85" stroke="#00f3ff" stroke-width="1.5" />

  <!-- Hexagonal Node Lattice -->
  <polygon points="64,24 98,44 98,84 64,104 30,84 30,44" fill="none" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan)" />
  <polygon points="64,32 91,48 91,80 64,96 37,80 37,48" fill="#00f3ff" fill-opacity="0.1" stroke="#006688" stroke-width="1" />

  <!-- Core Pulsing Crystal -->
  <polygon points="64,44 80,54 80,74 64,84 48,74 48,54" fill="url(#grad-cyan)" filter="url(#glow-cyan)" />
  <circle cx="64" cy="64" r="6" fill="#ffffff" filter="url(#glow-cyan)" />

  <!-- Node Connection Sockets -->
  <circle cx="64" cy="14" r="3" fill="#00f3ff" />
  <circle cx="114" cy="64" r="3" fill="#00f3ff" />
  <circle cx="64" cy="114" r="3" fill="#00f3ff" />
  <circle cx="14" cy="64" r="3" fill="#00f3ff" />
</svg>
