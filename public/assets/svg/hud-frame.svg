<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150">
  <defs>
    <filter id="glow-cyan-frame" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Translucent Slate -->
  <polygon points="16,0 300,0 300,126 284,150 0,150 0,24" fill="#050c17" fill-opacity="0.75" />

  <!-- Outer HUD Cut Corner Frame -->
  <polygon points="16,0 300,0 300,126 284,150 0,150 0,24" fill="none" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan-frame)" />

  <!-- Top Left Corner Accent Marks -->
  <polygon points="0,0 24,0 0,24" fill="#00f3ff" />
  <line x1="32" y1="8" x2="120" y2="8" stroke="#00f3ff" stroke-width="3" />

  <!-- Bottom Right Accent Marks -->
  <polygon points="300,150 276,150 300,126" fill="#ff0055" />
  <line x1="180" y1="142" x2="268" y2="142" stroke="#ff0055" stroke-width="3" />

  <!-- Grid Tech Ticks -->
  <line x1="10" y1="40" x2="10" y2="110" stroke="#00f3ff" stroke-width="1" stroke-dasharray="4 4" />
  <rect x="288" y="20" width="4" height="4" fill="#00f3ff" />
  <rect x="288" y="30" width="4" height="4" fill="#00f3ff" />
  <rect x="288" y="40" width="4" height="4" fill="#00f3ff" />
</svg>
