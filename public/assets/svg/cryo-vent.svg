<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Turbine Outer Ring -->
  <circle cx="64" cy="64" r="54" fill="#041226" stroke="#00aaff" stroke-width="2" />
  <circle cx="64" cy="64" r="46" fill="none" stroke="#00e1ff" stroke-width="1" stroke-dasharray="6 3" />

  <!-- Cryo Snowflake / Turbine Blades -->
  <g stroke="#00e1ff" stroke-width="3" stroke-linecap="round" filter="url(#glow-blue)">
    <!-- Main Axes -->
    <line x1="64" y1="24" x2="64" y2="104" />
    <line x1="24" y1="64" x2="104" y2="64" />
    <line x1="36" y1="36" x2="92" y2="92" />
    <line x1="36" y1="92" x2="92" y2="36" />

    <!-- Frost Chevron Branches -->
    <path d="M56 32 L64 24 L72 32 M56 96 L64 104 L72 96" fill="none" />
    <path d="M32 56 L24 64 L32 72 M96 56 L104 64 L96 72" fill="none" />
  </g>

  <circle cx="64" cy="64" r="10" fill="#00e1ff" filter="url(#glow-blue)" />
  <circle cx="64" cy="64" r="4" fill="#ffffff" />
</svg>
